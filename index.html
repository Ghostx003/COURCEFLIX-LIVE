<!doctype html>
<html lang="en" data-theme="dark" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseFlix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script src="/legacy.js?v=12"></script>
      <script>
        // Global click handler to resolve clicks from deep nested subfolders back to root uploaded handlers
        document.addEventListener('click', function(e) {
          var targetFile = e.target.closest('.dpp-item, .notes-item, .lecture-item, .course-card');
          if (!targetFile || e.target.closest('.delete-dpp-btn, .delete-note-btn, .delete-all-dpps-btn, .delete-all-notes-btn')) return;
          
          // Normalize deep nested pathname back to root root-relative routing
          if (window.location.pathname !== '/' && !window.location.pathname.endsWith('index.html')) {
            try {
              window.history.replaceState(null, '', '/' + (window.location.hash || ''));
            } catch(err) {}
          }
        }, true);
      </script>
  </body>
</html>
